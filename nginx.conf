# nginx.conf — Production config for ToolHub (Next.js)
# Place this at /etc/nginx/sites-available/toolhub and symlink to sites-enabled

upstream toolhub_app {
    server localhost:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name toolhub.app www.toolhub.app;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name toolhub.app www.toolhub.app;

    # SSL — use certbot to generate these:
    # sudo certbot --nginx -d toolhub.app -d www.toolhub.app
    ssl_certificate     /etc/letsencrypt/live/toolhub.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolhub.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location /_next/static/ {
        proxy_pass http://toolhub_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        proxy_pass http://toolhub_app;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy all other requests to Next.js
    location / {
        proxy_pass http://toolhub_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Don't cache HTML pages (let Next.js handle caching)
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
